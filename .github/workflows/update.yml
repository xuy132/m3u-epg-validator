name: Daily M3U/EPG Validation

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run validator
        run: python scripts/main.py

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update validated M3U/EPG sources $(date -u +%Y-%m-%d)"
            git push
          fi
